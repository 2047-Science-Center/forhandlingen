<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scen 3 · Ordväxlingen</title>
<style>
  html, body { margin: 0; height: 100%; background: #141518; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Scen 3 — Förhandlingen, ordväxling (F1). Talar-växlingarna ligger exakt på B1-tiderna
// så Josefs inlästa ordväxling kan läggas på samma tidslinje i efterhand.
// ?spela-in = spela in ett varv (canvas), ?t=6 = frys tiden.
import { THREE, ramp, makeStation, makeScreenTexture, makeCast, dim, timeline, createStage } from './lib.js';

const LOOP = 15;

// Långsam båge runt stationens kortsida (+X) där båda sidors talare syns över väggkanten:
// från Syd-sidan (A, Z>0) mot Nord-sidan (B, Z<0), med en svag dragning mot den som talar.
let lean = 0, leanTarget = 0;
const R = 3.0, H = 2.75;
const cam = t => {
  const u = ramp(t, 0, LOOP);
  const ang = THREE.MathUtils.degToRad(42 - 84 * u) + lean * 0.12;   // vinkel från +X i XZ-planet
  return {
    pos: new THREE.Vector3(Math.cos(ang) * R, H, Math.sin(ang) * R),
    look: new THREE.Vector3(0.2, 1.2, lean * 0.18),
    fov: 40,
  };
};
const stage = createStage({ name: 'forhandlingen-scen3-ordvaxling', loop: LOOP, camera: cam });
const { scene } = stage;

const station = makeStation({ screenTex: { A: makeScreenTexture('VALV SYD'), B: makeScreenTexture('VALV NORD') } });
scene.add(station.group);
const cast = makeCast(scene);
// Rapportörerna är tysta: dimmade i hela scenen.
cast.rapportor.forEach(f => dim(f, 0.6));

// Vem talar: sida A = Valv Syd, B = Valv Nord. Sidans två sändebud turas om mellan replikerna.
const turn = { A: 0, B: 0 };
let current = null;
const speakers = { A: ['sandebud1', 'sandebud2'], B: ['sandebud1', 'sandebud2'] };
function talk(side) {
  cast.sandebud.forEach(f => f.setSpeaking(false));
  leanTarget = 0; current = null;
  if (!side) return;
  const f = cast[side][speakers[side][turn[side]++ % 2]];
  f.setSpeaking(true); current = f;
  leanTarget = side === 'A' ? 1 : -1;
}
const reset = () => { turn.A = 0; turn.B = 0; talk(null); };

const tl = timeline([
  { at: 0.00,  do: () => { reset(); talk('B'); } },  // Nord
  { at: 4.83,  do: () => talk('A') },                // Syd
  { at: 5.86,  do: () => talk('B') },                // Nord
  { at: 7.78,  do: () => talk('A') },                // Syd
  { at: 8.92,  do: () => talk(null) },               // båda tysta, håller
  { at: 12.76, do: () => talk('B') },                // Nord
  { at: 13.81, do: () => talk('A') },                // Syd
  { at: 14.5,  do: () => talk(null) },               // tona ut → scen 4
]);

stage.start((t, dt) => {
  tl(t);
  lean += (leanTarget - lean) * Math.min(1, dt * 1.5);
  // icke-talande sändebud lite dimmade så talaren poppar
  cast.sandebud.forEach((f, i) => { dim(f, current && f !== current ? 0.35 : 0); f.update(t + i * 0.5, dt); });
  cast.rapportor.forEach((f, i) => f.update(t + i * 0.8, dt));
  stage.setFade(1 - ramp(t, 0, 0.4) + ramp(t, 14.5, 15));
});
</script>
</body>
</html>
