<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Förhandlingen: från text till bild. Utvärdering + skisser (inte stationsmedia). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05100b; }
      #root { position: relative; width: 100%; height: 100%; background: #05100b; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #0c1d16 0%, #05100b 72%); }
      #scan { position: absolute; inset: 0; z-index: 50; pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="nu" data-composition-id="nu" data-composition-src="compositions/nu.html"
        data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="lucka" data-composition-id="lucka" data-composition-src="compositions/lucka.html"
        data-start="8" data-duration="16" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="instr" data-composition-id="instr" data-composition-src="compositions/instr.html"
        data-start="24" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="karta" data-composition-id="karta" data-composition-src="compositions/karta.html"
        data-start="36" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="scan" class="clip" data-start="0" data-duration="44" data-track-index="2"></div>

      <!-- Stationens egna ljud på synliga händelser -->
      <audio id="a-lucka" class="clip" src="assets/audio/sfx-hatch-open.mp3" data-start="9.0" data-duration="0.6" data-track-index="5" data-volume="0.6"></audio>
      <audio id="a-b1" class="clip" src="assets/audio/sfx-tick.mp3" data-start="11.6" data-duration="0.48" data-track-index="5" data-volume="0.4"></audio>
      <audio id="a-b2" class="clip" src="assets/audio/sfx-tick.mp3" data-start="13.0" data-duration="0.48" data-track-index="5" data-volume="0.4"></audio>
      <audio id="a-b3" class="clip" src="assets/audio/sfx-tick.mp3" data-start="14.4" data-duration="0.48" data-track-index="5" data-volume="0.4"></audio>
      <audio id="a-b4" class="clip" src="assets/audio/sfx-tick.mp3" data-start="15.8" data-duration="0.48" data-track-index="5" data-volume="0.4"></audio>
      <audio id="a-klubba" class="clip" src="assets/audio/sfx-klubbslag.mp3" data-start="18.1" data-duration="0.8" data-track-index="5" data-volume="0.8"></audio>
      <audio id="a-i1" class="clip" src="assets/audio/sfx-stamp.mp3" data-start="26.0" data-duration="1" data-track-index="5" data-volume="0.5"></audio>
      <audio id="a-i2" class="clip" src="assets/audio/sfx-popup.mp3" data-start="29.6" data-duration="0.48" data-track-index="5" data-volume="0.4"></audio>
      <audio id="a-i3" class="clip" src="assets/audio/sfx-popup.mp3" data-start="33.0" data-duration="0.48" data-track-index="5" data-volume="0.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
