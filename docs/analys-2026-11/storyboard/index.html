<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Förhandlingen: nuläge mot förslag. Storyboard till ANALYS-FLODE-2026-11.md (skiss, inte stationsmedia). -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05100b; }
      #root { position: relative; width: 100%; height: 100%; background: #05100b; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, #0b1d14 0%, #05100b 70%); }
      #scan { position: absolute; inset: 0; z-index: 50; pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.28) 0 2px, transparent 2px 4px); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="68" data-width="1920" data-height="1080">
      <div id="bg"></div>

      <div id="titel" data-composition-id="titel" data-composition-src="compositions/titel.html"
        data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tid" data-composition-id="tid" data-composition-src="compositions/tid.html"
        data-start="5" data-duration="14" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="steg" data-composition-id="steg" data-composition-src="compositions/steg.html"
        data-start="19" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="lucka" data-composition-id="lucka" data-composition-src="compositions/lucka.html"
        data-start="30" data-duration="13" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="coach" data-composition-id="coach" data-composition-src="compositions/coach.html"
        data-start="43" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="spellage" data-composition-id="spellage" data-composition-src="compositions/spellage.html"
        data-start="54" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="forslag" data-composition-id="forslag" data-composition-src="compositions/forslag.html"
        data-start="61" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="scan" class="clip" data-start="0" data-duration="68" data-track-index="2"></div>

      <!-- Ljud: stationens egna sfx (public/Sound/sfx), på synliga händelser -->

      <audio id="a-tick1" class="clip" src="assets/audio/sfx-tick.mp3" data-start="11.6" data-duration="0.48" data-track-index="5" data-volume="0.5"></audio>

      <audio id="a-pop1" class="clip" src="assets/audio/sfx-popup.mp3" data-start="25.6" data-duration="0.48" data-track-index="5" data-volume="0.45"></audio>
      <audio id="a-t1" class="clip" src="assets/audio/sfx-tick.mp3" data-start="32.0" data-duration="0.48" data-track-index="5" data-volume="0.35"></audio>

      <audio id="a-live" class="clip" src="assets/audio/sfx-phase-live.mp3" data-start="58.0" data-duration="2.0" data-track-index="6" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
